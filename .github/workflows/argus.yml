name: Argus QA

# Runs the full Argus loop against the bundled demo app on every pull request,
# then posts the result as a PR comment.
#
# The gate is deliberately severity-based, not pass/fail based: flaky tests and
# stale selectors are reported but never block a merge. Only a *new* bug that
# triage classified as a real bug, at or above ARGUS_SEVERITY_FAIL_THRESHOLD,
# fails the build. This is the whole point - a QA gate nobody trusts gets
# ignored, and the usual reason nobody trusts one is flaky tests blocking
# unrelated PRs.
#
# "New" is measured against baseline/known-bugs.json, which is committed on
# purpose. Without it this job fails on every pull request, including ones that
# change nothing: the demo app ships three deliberate defects, and the runtime
# store they would be compared against lives in gitignored data/, so on a fresh
# checkout there is nothing to compare to and all three read as new. Adding an
# entry to that file is an explicit, reviewed decision in a diff. See ADR 0007.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Needed to post the PR comment.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: argus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Plan, run, triage, file
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ARGUS_TARGET: http://localhost:4317
      ARGUS_CI_THRESHOLD: ${{ vars.ARGUS_CI_THRESHOLD || 'high' }}
      # The workflow reads this one, so it has to be defined. It did not
      # exist before: the gate message interpolated an unset variable and
      # announced "at or above the '' severity threshold" on the first real
      # finding - the least useful sentence available at the moment a reader
      # needs it.
      ARGUS_SEVERITY_FAIL_THRESHOLD: ${{ vars.ARGUS_CI_THRESHOLD || 'high' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ARGUS_ANTHROPIC_MODEL: ${{ vars.ARGUS_ANTHROPIC_MODEL || 'claude-sonnet-4-20250514' }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        # These never call the Anthropic API - they run against fixtures.
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Start the demo app
        run: |
          pnpm run demo &
          # Target 127.0.0.1, not localhost: on Ubuntu runners `localhost` can
          # resolve to ::1 first and wait-on will sit there until it times out.
          pnpm exec wait-on tcp:127.0.0.1:4317 --timeout 60000
          curl -fsS http://127.0.0.1:4317/ > /dev/null && echo "Demo app responding."

      # Without a key, fall back to mock mode so forks and Dependabot PRs still
      # get a working run instead of a red X they cannot fix.
      #
      # Note the *script* is selected rather than a flag passed through
      # `pnpm run argus -- run --mock`. pnpm 11 forwards that separator to the
      # script verbatim, so the CLI received `-- run --mock`, commander never
      # saw the subcommand, and the run aborted with "ANTHROPIC_API_KEY is not
      # set, and --mock was not passed" while no data/ directory was written at
      # all. Selecting a script passes no arguments and cannot be broken this
      # way.
      - name: Decide run mode
        id: mode
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "script=run" >> "$GITHUB_OUTPUT"
            echo "label=live" >> "$GITHUB_OUTPUT"
          else
            echo "script=run:mock" >> "$GITHUB_OUTPUT"
            echo "label=mock (no ANTHROPIC_API_KEY available)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Argus
        # Do not fail the step here, so the comment and summary below always get
        # to report. This is safe *only* because nothing downstream keys the
        # gate off this step's status: `continue-on-error` makes GitHub report
        # `conclusion: success` for a command that exited non-zero, and keying
        # off `steps.argus.outcome` is exactly how a run that never happened
        # came to be announced as one that found a bug. The gate reads the
        # artifact instead.
        continue-on-error: true
        run: |
          echo "Run mode: ${{ steps.mode.outputs.label }}"
          pnpm run "${{ steps.mode.outputs.script }}"

      - name: Build the PR comment
        if: always()
        # `argus ci-comment` needs a completed run to read. If the pipeline
        # died before writing one, emit a plain failure notice instead - the
        # comment step must never be the thing that breaks the build, or the
        # real error gets buried under an ENOENT.
        run: |
          if pnpm run --silent ci-comment --out argus-comment.md; then
            echo "Comment rendered from the run artifact."
          else
            {
              echo "### Argus did not complete"
              echo
              echo "The pipeline failed before it could produce a run artifact, so there"
              echo "is no triage summary to report. See the job log for the failing step."
            } > argus-comment.md
          fi

      - name: Add to job summary
        if: always()
        run: cat argus-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post the PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('argus-comment.md', 'utf8');
            const marker = '<!-- argus-report -->';

            // Update the existing comment rather than stacking a new one on
            // every push - a long PR should not accumulate twenty reports.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes(marker)
            );

            const payload = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: payload,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: payload,
              });
            }

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: argus-run
          path: |
            data/
            generated-tests/
          retention-days: 14
          if-no-files-found: warn

      - name: Verify the run, then enforce its gate
        # The single authority on whether Argus passed. It reads the verdict
        # from data/runs/<id>/run.json, which the pipeline writes only after all
        # seven stages finish, rather than from any step's exit status.
        #
        # Three outcomes, three annotations. Exit 2 means the pipeline did not
        # complete - no artifact, no verdict - and it is deliberately a
        # different failure from exit 1, with a message that does not pretend a
        # gate was evaluated. Conflating them is the failure this step exists
        # to prevent, and it happened here for seven consecutive runs.
        #
        # `always()` so a crashed run still gets reported as incomplete rather
        # than leaving the job to fail on the masked step with no explanation.
        if: always()
        run: |
          code=0
          pnpm run --silent verify-run || code=$?
          case "$code" in
            0)
              echo "::notice::Argus run verified complete; gate passed."
              ;;
            1)
              echo "::error::Argus found a new real bug at or above the '$ARGUS_SEVERITY_FAIL_THRESHOLD' severity threshold. See the PR comment for details."
              ;;
            2)
              echo "::error::Argus produced no usable run artifact - the pipeline did not complete. This is not a gate result; check the job log for the stage that stopped."
              ;;
            *)
              echo "::error::'argus verify-run' exited unexpectedly with $code."
              ;;
          esac
          exit "$code"
